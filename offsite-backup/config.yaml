name: Offsite Backup
version: "1.12.2"
slug: offsite_backup
description: Offsite Backup via rsync + ZFS Snapshot auf externen Storage-Host mit BackupPC-Recovery direkt auf Home Assistant.
url: https://github.com/XtraLarge/ha-offsite-backup
arch:
  - aarch64
  - amd64
init: false

options:
  zfs_storage_host: ""
  zfs_storage_user: "root"
  offsite_user: ""
  offsite_host: ""
  offsite_port: 23
  offsite_box_id: 0
  backup_schedule: "0 20 * * 3"
  loki_url: ""
  mqtt_discovery: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  ssh_key_storage: ""
  ssh_key_offsite: ""
  offsite_token: ""
  backuppc_port: 8080
  offsite_path: "/home"
  snapshot_prefix: "pre_rsync"
  offsite_snapshot_keep: 20
  pbs_server_host: "10.10.11.1"
  pbs_server_port: 8007
  pbs_api_token: ""
  pbs_datastore: "NAS"
  pbs_namespace: "GVMHP"
  pbs_pve_storage_name: "PBS-GVMHP"
  pbs_lxc_vmid: 901
  pbs_lxc_pve_node: "nas"
  pbs_lxc_os_storage: "local-lvm"
  pbs_lxc_data_zfs_dataset: "ZPool/PBS-recovered"
  pbs_lxc_hetzner_pbs_path: "ZPool/PBS"
  pbs_lxc_hetzner_dump_path: "ZPool/VMGuest/VMBackup/dump"
  nas_hetzner_key: "/root/offsite-restore/id_ed25519_restore"
  backuppc_docker_host: "10.10.11.0"
  backuppc_container_name: "backuppc"
  backuppc_data_path: "/ZPool/BackupPC"
  backuppc_config_path: "/ZPool/Docker/backuppc/config"
  backuppc_home_path: "/ZPool/Docker/backuppc/home"
  backuppc_sshconfig_path: "/ZPool/Docker/backuppc/ssh_config"
  pve_host: "10.10.4.10"
  pve_api_token: ""
  auto_resume_backup: true
  smoke_test_after_backup: true
  backup_sources:
    - dest: "ZPool/BackupPC"
      dataset: "ZPool/BackupPC"
      path: ""
      snapshot: true
      parallel: true
      recovery: "topdir"
      container_mount: "/data/backuppc"
      recovery_clean: false
    - dest: "ZPool/Docker/backuppc/config"
      dataset: ""
      path: "/ZPool/Docker/backuppc/config"
      snapshot: false
      parallel: false
      recovery: "import"
      container_mount: "/etc/backuppc"
      recovery_clean: true
    - dest: "ZPool/Docker/backuppc/home"
      dataset: ""
      path: "/ZPool/Docker/backuppc/home"
      snapshot: false
      parallel: false
      recovery: "import"
      container_mount: "/home/backuppc"
      recovery_clean: false
    - dest: "ZPool/Docker/backuppc/ssh_config"
      dataset: ""
      path: "/ZPool/Docker/backuppc/ssh_config"
      snapshot: false
      parallel: false
      recovery: "import"
      container_mount: "/etc/ssh/ssh_config"
      recovery_clean: false
    - dest: "ZPool/Docker/_DockerCreate"
      dataset: ""
      path: "/ZPool/Docker/_DockerCreate"
      snapshot: false
      parallel: false
      recovery: "none"
      container_mount: ""
      recovery_clean: false
    - dest: "ZPool/PBS"
      dataset: ""
      path: "/ZPool/PBS"
      snapshot: false
      parallel: true
      recovery: "none"
      container_mount: ""
      recovery_clean: false

schema:
  zfs_storage_host: str
  zfs_storage_user: str
  offsite_user: str
  offsite_host: str
  offsite_port: int
  offsite_box_id: int
  backup_schedule: str
  loki_url: str
  mqtt_discovery: bool
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  ssh_key_storage: password
  ssh_key_offsite: password
  offsite_token: password
  backuppc_port: int
  offsite_path: str
  snapshot_prefix: str
  offsite_snapshot_keep: int
  pbs_server_host: str
  pbs_server_port: int
  pbs_api_token: password
  pbs_datastore: str
  pbs_namespace: str
  pbs_pve_storage_name: str
  pbs_lxc_vmid: int
  pbs_lxc_pve_node: str
  pbs_lxc_os_storage: str
  pbs_lxc_data_zfs_dataset: str
  pbs_lxc_hetzner_pbs_path: str
  pbs_lxc_hetzner_dump_path: str
  nas_hetzner_key: str
  backuppc_docker_host: str
  backuppc_container_name: str
  backuppc_data_path: str
  backuppc_config_path: str
  backuppc_home_path: str
  backuppc_sshconfig_path: str
  pve_host: str
  pve_api_token: password
  auto_resume_backup: bool
  smoke_test_after_backup: bool
  backup_sources:
    - dest: str
      dataset: str?
      path: str?
      snapshot: bool
      parallel: bool
      recovery: str?
      container_mount: str?
      recovery_clean: bool?

docker_api: true
hassio_api: true
homeassistant_api: true
hassio_role: manager

privileged:
  - SYS_ADMIN

apparmor: false

devices:
  - /dev/fuse

ports:
  8099/tcp: null

ingress: true
panel_icon: mdi:cloud-upload
panel_title: Offsite Backup
