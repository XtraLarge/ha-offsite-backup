name: naming-guard
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hier stand bis 2026-11-01 ein zweites, inline gepflegtes Muster. Es war
      # schwaecher als scripts/naming-guard.sh (kein 192.168/172.16, keine
      # Storage-Box-Accounts, keine Key-/Secret-Erkennung) und kannte die
      # .naming-guard-allow nicht. Zwei Muster driften auseinander; dieser Job
      # ist ausserdem KEIN required check, ist also rot geworden, ohne zu
      # blockieren. Jetzt eine Quelle der Wahrheit.
      - name: Leak-Guard (scripts/naming-guard.sh)
        run: bash scripts/naming-guard.sh
