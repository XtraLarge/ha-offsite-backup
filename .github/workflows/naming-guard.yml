name: naming-guard
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for internal hostnames/IPs
        run: |
          PATTERN='10\.[1-9][0-9]?\.[0-9]{1,3}\.[0-9]{1,3}|fritz\.box|derwerres\.de'
          if git ls-files -z | xargs -0 grep -lIE "$PATTERN" 2>/dev/null | grep -v naming-guard; then
            echo "::error::Internal hostnames/IPs found - see above"
            exit 1
          fi
